  <!-- ============================================================
       Google Analytics 4 (gtag.js) — dos propiedades:
         G-EMK9RDJD0G  cuenta original (administrada por quien hizo el sitio antes; sin acceso hoy)
         G-WQEPLNPF0Y  cuenta de Fabian Herrera (desde 2026-11-06)
       Cada visita y cada evento se envían a las dos.
       Guard: solo se carga en producción (creaciondigital.online, www. y
       el sitio de Netlify creaciondigital-ueb.netlify.app, que es donde vive
       hoy). Migración de dominio 2026-06-09: ceopacademia.org → creaciondigital.online.
       Eventos propios: clic en "Agenda tu charla informativa" (agenda_charla)
       y en "Aplica ahora" (aplica_ahora), en cualquier página; en GA4 se
       pueden marcar como eventos clave.
       En localhost / dev no se inyecta para no inflar métricas con
       la navegación de desarrollo. El snippet de Google queda
       envuelto pero sin modificaciones a su lógica interna.
       ============================================================ -->
  <script>
    (function () {
      var host = window.location.hostname;
      var isProd = host === 'creaciondigital.online' || host === 'www.creaciondigital.online'
        || host === 'creaciondigital-ueb.netlify.app';
      if (!isProd) return;

      // Cargar gtag.js de forma async
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-EMK9RDJD0G';
      document.head.appendChild(s);

      // Inicialización gtag (idéntica al snippet de Google)
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-EMK9RDJD0G');
      gtag('config', 'G-WQEPLNPF0Y');

      // Clics en los dos llamados a la acción, por URL de destino (así cubre
      // todos los botones del sitio sin tocar cada componente).
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        var name = href.indexOf('forms.cloud.microsoft') !== -1 ? 'agenda_charla'
          : href.indexOf('unbosque.edu.co/inscripciones') !== -1 ? 'aplica_ahora'
          : null;
        if (name) gtag('event', name, { page_path: location.pathname, link_text: (a.textContent || '').trim().slice(0, 60) });
      }, true);
    })();
  </script>
